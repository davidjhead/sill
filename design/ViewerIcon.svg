<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><defs>
<linearGradient id="v-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a1c"></stop><stop offset="1" stop-color="#000000"></stop></linearGradient>
<linearGradient id="v-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.6"></stop><stop offset="0.4" stop-color="#ffffff" stop-opacity="0.1"></stop><stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop></linearGradient>
<linearGradient id="v-grey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c7e86" stop-opacity="0.98"></stop><stop offset="1" stop-color="#4c4e56" stop-opacity="0.96"></stop></linearGradient>
<linearGradient id="v-deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e9099"></stop><stop offset="1" stop-color="#555760"></stop></linearGradient>
<filter id="v-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"></feGaussianBlur></filter>
<filter id="v-lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"></feDropShadow></filter>
<filter id="v-back" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"></feDropShadow></filter>
<clipPath id="v-imacclip"><rect x="176" y="150" width="672" height="400" rx="58"></rect></clipPath>
<clipPath id="v-lidclip"><path d="M292 730 V464 Q292 430 326 430 H698 Q732 430 732 464 V730 Z"></path></clipPath>
</defs>
<g>
<!-- Sill Viewer, the Mac client: Sill's own icon (design/AppIcon.svg) with a MacBook in front of the
     iMac where the iPad was. Four groups, as Sill's: background, iMac, MacBook, window. -->
<!-- layer 1: background -->
<rect x="0" y="0" width="1024" height="1024" fill="url(#v-bg)"></rect>
<g transform="translate(0 51)">
<!-- layer 2: iMac, space grey glass sitting back -->
<g filter="url(#v-back)">
<rect x="372" y="588" width="280" height="36" rx="18" fill="url(#v-grey)"></rect>
<rect x="480" y="546" width="64" height="48" fill="url(#v-grey)"></rect>
<rect x="176" y="150" width="672" height="400" rx="58" fill="url(#v-grey)"></rect>
</g>
<rect x="204" y="178" width="616" height="300" rx="34" fill="#07080a" fill-opacity="0.97"></rect>
<rect x="176" y="150" width="672" height="400" rx="58" fill="url(#v-gloss)" clip-path="url(#v-imacclip)" opacity="0.5"></rect>
<rect x="177.5" y="151.5" width="669" height="397" rx="57" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"></rect>
<!-- layer 3: MacBook, slate glass in front, tilted -->
<g transform="rotate(-4 512 600)">
<rect x="282" y="470" width="460" height="300" rx="40" fill="#000000" fill-opacity="0.5" filter="url(#v-blur)"></rect>
<g filter="url(#v-lift)">
<path d="M292 730 V464 Q292 430 326 430 H698 Q732 430 732 464 V730 Z" fill="#2a2f3a"></path>
<path d="M240 730 H784 L760 762 Q754 772 740 772 H284 Q270 772 264 762 Z" fill="url(#v-deck)"></path>
</g>
<rect x="470" y="730" width="84" height="12" rx="6" fill="#3c3e46"></rect>
<rect x="314" y="452" width="396" height="262" rx="18" fill="#f7f8fa"></rect>
<circle cx="512" cy="441" r="4.5" fill="#6b7079"></circle>
<!-- layer 4: the streamed window inside the MacBook -->
<rect x="340" y="480" width="344" height="196" rx="20" fill="#ffffff"></rect>
<rect x="340" y="480" width="344" height="40" rx="20" fill="#9bb7ff"></rect>
<rect x="340" y="500" width="344" height="20" fill="#9bb7ff"></rect>
<circle cx="366" cy="500" r="7" fill="#ffffff" fill-opacity="0.7"></circle>
<circle cx="388" cy="500" r="7" fill="#ffffff" fill-opacity="0.5"></circle>
<circle cx="410" cy="500" r="7" fill="#ffffff" fill-opacity="0.35"></circle>
<rect x="366" y="548" width="160" height="14" rx="7" fill="#5a5f6b" fill-opacity="0.9"></rect>
<rect x="366" y="578" width="230" height="14" rx="7" fill="#5a5f6b" fill-opacity="0.55"></rect>
<rect x="366" y="608" width="120" height="14" rx="7" fill="#5a5f6b" fill-opacity="0.55"></rect>
<path d="M292 730 V464 Q292 430 326 430 H698 Q732 430 732 464 V730 Z" fill="url(#v-gloss)" clip-path="url(#v-lidclip)" opacity="0.8"></path>
<path d="M293.5 730 V464 Q293.5 431.5 326 431.5 H698 Q730.5 431.5 730.5 464 V730" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"></path>
</g>
</g>
</g></svg>
